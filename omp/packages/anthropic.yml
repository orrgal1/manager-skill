# Agent package: Anthropic subscription. Apply with: mgr package anthropic
# Rungs: Fable (top) > Opus (work) > Sonnet (mid) > Haiku (bottom, no Haiku 5 id
# exists here, so the bottom rung collapses onto Sonnet at low).
# Top rung: builder (`size:large` builder sessions only — `mgr launch` passes `--model
# @builder` for those); smith is the new work-rung role every smaller builder session
# runs on. plan (deep, for large builders), sketch (the same planner contract, narrower
# — medium builders and small planning triggers; the planner never sits below the
# builder that consumes its plan), review (the reviewer and security-reviewer agents,
# for the surfaces builder.md §7 sends to the top rung), and crux (the fumble target: a
# fresh executor for a step a builder has failed) — the same rung as a large builder, so
# crux buys a fresh context there, but a genuine rung up for a smith builder, which is
# the point of the split);
# sweep (the reviewer for everything §7 sends to the work rung) sits with
# default/large/medium/smith on the work rung; small and smol (scouts feed the plan) the
# mid rung; tiny (omp's own role) and commit the bottom rung at low.
# Effort: high for everything that writes or decides code, medium for the roles
# that decide nothing, low for the bottom rung. high is the ceiling, never a tier above it.
# `tiny` is also omp's own role for titles, memory and auto-thinking, so it stays
# cheap; the tiny AGENT runs on @small (same model as small, different workflow).
# Ids confirmed by `omp models anthropic --json` on 2026-09-05.
modelRoles:
  default: anthropic/claude-opus-5:high
  plan: anthropic/claude-fable-5-1:high
  review: anthropic/claude-fable-5-1:high
  crux: anthropic/claude-fable-5-1:high
  large: anthropic/claude-opus-5:high
  medium: anthropic/claude-opus-5:high
  builder: anthropic/claude-fable-5-1:high
  smith: anthropic/claude-opus-5:high
  sketch: anthropic/claude-fable-5-1:high
  sweep: anthropic/claude-opus-5:high
  small: anthropic/claude-sonnet-5:high
  tiny: anthropic/claude-sonnet-5:low
  smol: anthropic/claude-sonnet-5:high
  slow: "@large"
  task: "@medium"
  complex: "@large"
  workhorse: "@small"
  fast: "@small"
  designer: anthropic/claude-sonnet-5:medium
  advisor: anthropic/claude-sonnet-5:medium
  vision: anthropic/claude-sonnet-5:medium
  commit: anthropic/claude-sonnet-5:low
task:
  agentModelOverrides:
    reviewer: "@review"
    security-reviewer: "@review"
    scout: "@smol"
    sonic: "@tiny"
    librarian: "@small"
    designer: "@small"
retry:
  fallbackChains:
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5:high
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5:high
